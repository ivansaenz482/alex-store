# ============================================================
#  ALEX.STORE - Nginx
#  ⚠️ REEMPLAZA `alexstore.MIDOMINIO.com` por tu dominio real
#  (en ambos bloques server). El certificado HTTPS se emite
#  automáticamente con certbot (ver README).
# ============================================================
server {
    listen 80;
    server_name alexstore.MIDOMINIO.com;

    # Ruta que usa certbot para validar el dominio
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name alexstore.MIDOMINIO.com;

    # Certificados (se generan con certbot)
    ssl_certificate     /etc/letsencrypt/live/alexstore.MIDOMINIO.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexstore.MIDOMINIO.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Límite de subida de imágenes (coincide con el límite 8MB del admin)
    client_max_body_size 12m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
